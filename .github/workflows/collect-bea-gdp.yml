name: Collect BEA current-dollar GDP

on:
  schedule:
    # NIPA GDP releases and annual updates are periodic; a weekly Thursday check
    # captures current data without downloading the complete quarterly flat file daily.
    - cron: "30 15 * * 4"
  workflow_dispatch:

concurrency:
  group: collect-bea-gdp
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test collector
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Collect complete BEA GDP series and validate
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          ./bin/finance-data sync us.national_accounts.gdp.current_dollars | tee /tmp/finance-data-summary.json
          ./bin/finance-data validate us.national_accounts.gdp.current_dollars
          if [[ -z "$(git status --porcelain -- data/)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish validated data PR
        if: steps.collect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="data/bea-gdp-update"
          git config user.name "finance-data bot"
          git config user.email "finance-data-bot@users.noreply.github.com"
          git checkout -B "$branch"
          git add data/
          git commit -m "data: update BEA current-dollar GDP"
          git push --force origin "$branch"
          pr_number="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "data: update BEA current-dollar GDP" \
              --body "Automated data-only update for \`us.national_accounts.gdp.current_dollars\`. Direct BEA NIPA flat-file collection, identity validation and deterministic normalization passed before publication."
            pr_number="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')"
          fi
          gh pr merge "$pr_number" --squash --delete-branch
      - name: Open collection failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title="BEA GDP collection failure"
          existing="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          body="The scheduled \`us.national_accounts.gdp.current_dollars\` collection workflow failed. Inspect run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ -z "$existing" ]]; then
            gh issue create --title "$title" --body "$body"
          else
            gh issue comment "$existing" --body "$body"
          fi
