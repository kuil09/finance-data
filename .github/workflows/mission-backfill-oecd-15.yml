name: mission-backfill-oecd-15

on:
  push:
    branches: [feat/15-oecd-cli]
    paths:
      - '.github/workflows/mission-backfill-oecd-15.yml'

concurrency:
  group: mission-backfill-oecd-15
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify source identity
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Run tests and compile checks
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
          python -m compileall -q src tests

      - name: Validate manifests before source access
        run: |
          python -m json.tool sources/oecd_data_explorer/source.json > /dev/null
          python -m json.tool datasets/global/leading_indicators/oecd_cli/dataset.json > /dev/null
          python -m json.tool catalog/datasets.json > /dev/null

      - name: Backfill official OECD CLI slice
        run: |
          set -euo pipefail
          ./bin/finance-data sync global.leading_indicators.oecd_cli --full | tee /tmp/oecd-summary.json
          ./bin/finance-data validate global.leading_indicators.oecd_cli | tee /tmp/oecd-validation.json
          python - <<'PY'
          import json
          report=json.load(open('/tmp/oecd-validation.json'))
          assert report['records'] == 14219, report
          assert report['reference_areas'] == 22, report
          assert report['first_period'] == '1955-01', report
          assert report['source_key'] == '.M.LI...AA...H', report
          PY

      - name: Validate all production datasets and deterministic rebuilds
        run: |
          set -euo pipefail
          datasets=(
            us.fiscal.debt.outstanding
            us.energy.petroleum.crude_oil.commercial_stocks
            us.prices.cpi_u.all_items
            us.national_accounts.gdp.current_dollars
            us.money_market.sofr
            kr.monetary_policy.base_rate
            ea.monetary_policy.deposit_facility_rate
            global.leading_indicators.oecd_cli
          )
          for dataset in "${datasets[@]}"; do
            ./bin/finance-data validate "$dataset"
          done
          before=$(find data/normalized -type f -name 'data.csv' -print0 | sort -z | xargs -0 sha256sum | sha256sum)
          for dataset in "${datasets[@]}"; do
            ./bin/finance-data rebuild "$dataset"
          done
          after=$(find data/normalized -type f -name 'data.csv' -print0 | sort -z | xargs -0 sha256sum | sha256sum)
          test "$before" = "$after"

      - name: Preserve verified data in task branch
        run: |
          set -euo pipefail
          git config user.name "finance-data bot"
          git config user.email "finance-data-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "data: backfill OECD composite leading indicator"
          git push origin HEAD:feat/15-oecd-cli
