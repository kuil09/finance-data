name: mission-backfill-eia-7

on:
  push:
    branches: [feat/7-eia-crude-stocks]

concurrency:
  group: mission-backfill-eia-7
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run tests before source access
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Backfill official EIA series
        run: |
          set -euo pipefail
          ./bin/finance-data sync us.energy.petroleum.crude_oil.commercial_stocks --full | tee /tmp/eia-summary.json
          ./bin/finance-data validate us.energy.petroleum.crude_oil.commercial_stocks
          python -m json.tool sources/us_eia/source.json > /dev/null
          python -m json.tool datasets/us/energy/petroleum/crude_oil/commercial_stocks/dataset.json > /dev/null
          python -m json.tool catalog/datasets.json > /dev/null
      - name: Verify offline rebuild is deterministic
        run: |
          set -euo pipefail
          before=$(find data/normalized/us.energy.petroleum.crude_oil.commercial_stocks -type f -name 'data.csv' -print0 | sort -z | xargs -0 sha256sum | sha256sum)
          ./bin/finance-data rebuild us.energy.petroleum.crude_oil.commercial_stocks
          after=$(find data/normalized/us.energy.petroleum.crude_oil.commercial_stocks -type f -name 'data.csv' -print0 | sort -z | xargs -0 sha256sum | sha256sum)
          test "$before" = "$after"
      - name: Preserve verified data in task branch
        run: |
          set -euo pipefail
          git config user.name "finance-data bot"
          git config user.email "finance-data-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "data: backfill EIA commercial crude stocks"
          git push origin HEAD:feat/7-eia-crude-stocks
