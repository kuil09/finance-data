name: mission-verify-ecb-14

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run tests and compile
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
          python -m compileall -q src tests

      - name: Validate source, dataset, and catalog
        run: |
          python -m json.tool sources/ecb_data_portal/source.json > /dev/null
          python -m json.tool datasets/ea/monetary_policy/deposit_facility_rate/dataset.json > /dev/null
          python -m json.tool catalog/datasets.json > /dev/null

      - name: Validate all production datasets
        run: |
          ./bin/finance-data validate us.fiscal.debt.outstanding
          ./bin/finance-data validate us.energy.petroleum.crude_oil.commercial_stocks
          ./bin/finance-data validate us.prices.cpi_u.all_items
          ./bin/finance-data validate us.national_accounts.gdp.current_dollars
          ./bin/finance-data validate us.money_market.sofr
          ./bin/finance-data validate kr.monetary_policy.base_rate
          ./bin/finance-data validate ea.monetary_policy.deposit_facility_rate

      - name: Verify offline rebuilds produce no canonical diff
        run: |
          set -euo pipefail
          ./bin/finance-data rebuild us.fiscal.debt.outstanding
          ./bin/finance-data rebuild us.energy.petroleum.crude_oil.commercial_stocks
          ./bin/finance-data rebuild us.prices.cpi_u.all_items
          ./bin/finance-data rebuild us.national_accounts.gdp.current_dollars
          ./bin/finance-data rebuild us.money_market.sofr
          ./bin/finance-data rebuild kr.monetary_policy.base_rate
          ./bin/finance-data rebuild ea.monetary_policy.deposit_facility_rate
          git diff --exit-code -- data/normalized/
