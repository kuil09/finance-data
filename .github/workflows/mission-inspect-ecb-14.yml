name: mission-inspect-ecb-14

on:
  push:
    branches: [feat/14-ecb-deposit-rate]
    paths:
      - '.github/workflows/mission-inspect-ecb-14.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect ECB Data API CSV contract
        shell: bash
        run: |
          set -euo pipefail
          url='https://data-api.ecb.europa.eu/service/data/FM/D.U2.EUR.4F.KR.DFR.LEV?format=csvdata&startPeriod=1999-01-01&detail=full'
          curl -fsS -H 'Accept: text/csv' "$url" -o /tmp/ecb.csv
          echo "BYTES=$(wc -c < /tmp/ecb.csv)"
          echo 'HEADER'
          head -1 /tmp/ecb.csv
          echo 'FIRST_ROWS'
          head -4 /tmp/ecb.csv
          echo 'LAST_ROWS'
          tail -4 /tmp/ecb.csv
          python - <<'PY'
          import csv, json
          rows=list(csv.DictReader(open('/tmp/ecb.csv', encoding='utf-8-sig', newline='')))
          print('ROWS=', len(rows))
          print('FIELDS=', json.dumps(list(rows[0]) if rows else [], ensure_ascii=False))
          if rows:
              print('FIRST=', json.dumps(rows[0], ensure_ascii=False, sort_keys=True))
              print('LAST=', json.dumps(rows[-1], ensure_ascii=False, sort_keys=True))
              for field in ('OBS_STATUS','OBS_CONF','OBS_PRE_BREAK','COMPILING_ORG','TIME_FORMAT','DECIMALS','UNIT_MULT'):
                  if field in rows[0]:
                      vals=sorted({str(r.get(field,'')) for r in rows})
                      print(field, vals[:30], 'count=', len(vals))
          PY
