name: mission-inspect-bok-11

on:
  push:
    branches: [feat/11-bok-ecos-base-rate]
    paths:
      - '.github/workflows/mission-inspect-bok-11.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY }}
    steps:
      - name: Inspect ECOS metadata and sample-key limits
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${BOK_ECOS_API_KEY:-}" ]]; then echo 'BOK_ECOS_API_KEY_PRESENT=true'; else echo 'BOK_ECOS_API_KEY_PRESENT=false'; fi
          key="${BOK_ECOS_API_KEY:-sample}"
          base='https://ecos.bok.or.kr/api'

          fetch() {
            local label="$1"; shift
            local url="$1"
            code=$(curl -sS -o "/tmp/${label}.json" -w '%{http_code}' "$url" || true)
            echo "=== $label HTTP=$code BYTES=$(wc -c < /tmp/${label}.json 2>/dev/null || echo 0) ==="
            python - "$label" <<'PY'
          import json,sys
          path='/tmp/'+sys.argv[1]+'.json'
          try:
              p=json.load(open(path))
          except Exception as e:
              print('json_error', e)
              print(open(path, errors='replace').read()[:2000])
              raise SystemExit
          print('top_keys', sorted(p) if isinstance(p,dict) else type(p).__name__)
          print(json.dumps(p, ensure_ascii=False, sort_keys=True)[:12000])
          PY
          }

          fetch item-list "$base/StatisticItemList/$key/json/kr/1/100/722Y001"
          fetch recent "$base/StatisticSearch/$key/json/kr/1/10/722Y001/D/20250101/20260906/0101000"
          fetch history-page "$base/StatisticSearch/$key/json/kr/1/100/722Y001/D/19990101/20260906/0101000"

          if [[ "$key" != sample ]]; then
            fetch history-large "$base/StatisticSearch/$key/json/kr/1/5000/722Y001/D/19990101/20260906/0101000"
          else
            fetch sample-over-limit "$base/StatisticSearch/sample/json/kr/1/11/722Y001/D/19990101/20260906/0101000"
          fi
