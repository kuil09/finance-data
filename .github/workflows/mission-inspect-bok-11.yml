name: mission-inspect-bok-11

on:
  push:
    branches: [feat/11-bok-ecos-base-rate]
    paths:
      - '.github/workflows/mission-inspect-bok-11.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY }}
    steps:
      - name: Quantify ECOS base-rate history and metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${BOK_ECOS_API_KEY:-}" ]]; then echo 'BOK_ECOS_API_KEY_PRESENT=true'; else echo 'BOK_ECOS_API_KEY_PRESENT=false'; fi
          key="${BOK_ECOS_API_KEY:-sample}"
          base='https://ecos.bok.or.kr/api'

          for spec in \
            "item-list|$base/StatisticItemList/$key/json/kr/1/10/722Y001" \
            "full-count|$base/StatisticSearch/$key/json/kr/1/10/722Y001/D/19990101/20260906/0101000" \
            "page-two|$base/StatisticSearch/$key/json/kr/11/20/722Y001/D/19990101/20260906/0101000"; do
            label=${spec%%|*}
            url=${spec#*|}
            code=$(curl -sS -o "/tmp/${label}.json" -w '%{http_code}' "$url" || true)
            echo "=== $label HTTP=$code ==="
            python - "$label" <<'PY'
          import json,sys
          label=sys.argv[1]
          p=json.load(open('/tmp/'+label+'.json'))
          print(json.dumps(p, ensure_ascii=False, sort_keys=True)[:16000])
          root=p.get('StatisticItemList') or p.get('StatisticSearch') if isinstance(p,dict) else None
          if isinstance(root,dict):
              print('list_total_count=', root.get('list_total_count'))
              rows=root.get('row') or []
              print('rows=',len(rows))
              if rows:
                  print('first=',json.dumps(rows[0],ensure_ascii=False,sort_keys=True))
                  print('last=',json.dumps(rows[-1],ensure_ascii=False,sort_keys=True))
          PY
          done
