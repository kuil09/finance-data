name: mission-backfill-bok-11

on:
  push:
    branches: [feat/11-bok-ecos-base-rate]
    paths:
      - '.github/workflows/mission-backfill-bok-11.yml'

concurrency:
  group: mission-backfill-bok-11
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify source identity
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Run tests and compile checks
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
          python -m compileall -q src tests

      - name: Validate manifests before source access
        run: |
          python -m json.tool sources/kr_bok_ecos/source.json > /dev/null
          python -m json.tool datasets/kr/monetary_policy/base_rate/dataset.json > /dev/null
          python -m json.tool catalog/datasets.json > /dev/null

      - name: Backfill official BOK ECOS monthly base-rate history
        run: |
          set -euo pipefail
          ./bin/finance-data sync kr.monetary_policy.base_rate --full | tee /tmp/bok-summary.json
          ./bin/finance-data validate kr.monetary_policy.base_rate | tee /tmp/bok-validation.json
          python - <<'PY'
          import json
          report=json.load(open('/tmp/bok-validation.json'))
          assert report['records'] >= 328, report
          assert report['first_period'] == '1999-05', report
          assert report['source_stat_code'] == '722Y001', report
          assert report['source_item_code'] == '0101000', report
          assert report['source_cycle'] == 'M', report
          PY

      - name: Validate all production datasets and deterministic rebuilds
        run: |
          set -euo pipefail
          datasets=(
            kr.monetary_policy.base_rate
            us.fiscal.debt.outstanding
            us.energy.petroleum.crude_oil.commercial_stocks
            us.prices.cpi_u.all_items
            us.national_accounts.gdp.current_dollars
            us.money_market.sofr
          )
          for dataset in "${datasets[@]}"; do
            ./bin/finance-data validate "$dataset"
          done
          before=$(find data/normalized -type f -name 'data.csv' -print0 | sort -z | xargs -0 sha256sum | sha256sum)
          for dataset in "${datasets[@]}"; do
            ./bin/finance-data rebuild "$dataset"
          done
          after=$(find data/normalized -type f -name 'data.csv' -print0 | sort -z | xargs -0 sha256sum | sha256sum)
          test "$before" = "$after"

      - name: Preserve verified data in task branch
        run: |
          set -euo pipefail
          git config user.name "finance-data bot"
          git config user.email "finance-data-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "data: backfill Bank of Korea base rate"
          git push origin HEAD:feat/11-bok-ecos-base-rate
