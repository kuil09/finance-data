name: mission-verify-source-eligibility-5

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source candidate registry
        run: python -m json.tool docs/source-candidates.json > /dev/null
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m compileall -q src tests
