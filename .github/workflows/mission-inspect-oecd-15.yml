name: mission-inspect-oecd-15

on:
  push:
    branches: [feat/15-oecd-cli]
    paths:
      - '.github/workflows/mission-inspect-oecd-15.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Verify shared SDMX adapter query compatibility
        shell: bash
        run: |
          set -euo pipefail
          url='https://sdmx.oecd.org/public/rest/data/OECD.SDD.STES,DSD_STES@DF_CLI,4.1/.M.LI...AA...H?format=csvdata&detail=full&dimensionAtObservation=AllDimensions'
          code=$(curl -sS -o /tmp/oecd.csv -w '%{http_code}' -H 'Accept: text/csv' "$url")
          echo "HTTP=$code BYTES=$(wc -c < /tmp/oecd.csv)"
          head -2 /tmp/oecd.csv | cut -c1-300
          python - <<'PY'
          import csv
          rows=list(csv.DictReader(open('/tmp/oecd.csv',encoding='utf-8-sig',newline='')))
          print('ROWS=',len(rows))
          assert len(rows) == 14219, len(rows)
          assert rows[0]['MEASURE'] == 'LI'
          assert rows[0]['ADJUSTMENT'] == 'AA'
          assert rows[0]['METHODOLOGY'] == 'H'
          PY
