name: mission-backfill-3-110943b0

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  backfill:
    if: github.event.pull_request.head.ref == 'feat/3-treasury-debt-dataset'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify source and tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Diagnose complete source history
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          from collections import Counter
          from finance_data.treasury import TreasuryFiscalDataAdapter

          result = TreasuryFiscalDataAdapter().fetch_debt_to_penny()
          nullable = ("debt_held_public_amt", "intragov_hold_amt", "tot_pub_debt_out_amt")
          rows = []
          for record in result.records:
              null_fields = tuple(field for field in nullable if record.get(field) in (None, "", "null", "None"))
              if null_fields:
                  rows.append((record["record_date"], null_fields, record))

          print(f"source_records={len(result.records)}")
          print(f"source_total_count={result.source_total_count}")
          print(f"null_records={len(rows)}")
          print("null_patterns=", Counter(fields for _, fields, _ in rows))
          if rows:
              print("first_null=", rows[0])
              print("last_null=", rows[-1])
              print("first_non_null_after=", next((r for r in result.records if r["record_date"] > rows[-1][0]), None))
          PY
