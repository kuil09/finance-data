name: mission-backfill-3-110943b0

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'feat/3-treasury-debt-dataset'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/3-treasury-debt-dataset
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download exact verified backfill artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/artifact
          mkdir -p /tmp/artifact
          gh run download 33923948658 \
            --repo "$GITHUB_REPOSITORY" \
            --name mission-backfill-3-110943b0 \
            --dir /tmp/artifact
          test "$(cat /tmp/artifact/source.commit)" = "7759e3a13741342129d4e088e242e6fd72dbb15c"
          expected="$(awk '{print $1}' /tmp/artifact/treasury-debt-backfill.tar.gz.sha256)"
          actual="$(sha256sum /tmp/artifact/treasury-debt-backfill.tar.gz | awk '{print $1}')"
          test "$expected" = "77fba66546bf7924a4317a338da20463283b452b55aa09908e5dabced37c5ac5"
          test "$actual" = "$expected"
      - name: Install and revalidate data artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf data
          tar -xzf /tmp/artifact/treasury-debt-backfill.tar.gz
          PYTHONPATH=src python -m unittest discover -s tests -v
          ./bin/finance-data validate us.fiscal.debt.outstanding
          normalized_hash="$(find data/normalized -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          test "$normalized_hash" = "3776f86736496aed49753b3ea534962e905039dd72a096e0cc7a19822ecb4484"
      - name: Commit verified data to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "finance-data bot"
          git config user.email "finance-data-bot@users.noreply.github.com"
          git add data/
          test -n "$(git diff --cached --name-only)"
          test -z "$(git diff --cached --name-only | grep -v '^data/' || true)"
          git commit -m "data: backfill U.S. Treasury debt history"
          git push origin HEAD:feat/3-treasury-debt-dataset
