name: mission-backfill-3-110943b0

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  backfill:
    if: github.event.pull_request.head.ref == 'feat/3-treasury-debt-dataset'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify source and tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Diagnose source invariant exceptions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          from decimal import Decimal
          from finance_data.treasury import TreasuryFiscalDataAdapter

          result = TreasuryFiscalDataAdapter().fetch_debt_to_penny()
          mismatches = []
          for record in result.records:
              if record["debt_held_public_amt"] == "null":
                  continue
              public = Decimal(record["debt_held_public_amt"])
              intragov = Decimal(record["intragov_hold_amt"])
              total = Decimal(record["tot_pub_debt_out_amt"])
              if total != public + intragov:
                  mismatches.append((record, total - public - intragov))

          print(f"source_records={len(result.records)}")
          print(f"mismatch_count={len(mismatches)}")
          for record, delta in mismatches:
              print("mismatch=", record, "delta=", delta)
          PY
