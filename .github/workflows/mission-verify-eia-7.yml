name: mission-verify-eia-7

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Validate manifests and catalog
        run: |
          python -m json.tool sources/us_eia/source.json > /dev/null
          python -m json.tool datasets/us/energy/petroleum/crude_oil/commercial_stocks/dataset.json > /dev/null
          python -m json.tool catalog/datasets.json > /dev/null
      - name: Validate checked-in datasets
        run: |
          ./bin/finance-data validate us.fiscal.debt.outstanding
          ./bin/finance-data validate us.energy.petroleum.crude_oil.commercial_stocks
      - name: Verify offline rebuilds produce no canonical diff
        run: |
          set -euo pipefail
          ./bin/finance-data rebuild us.fiscal.debt.outstanding
          ./bin/finance-data rebuild us.energy.petroleum.crude_oil.commercial_stocks
          git diff --exit-code -- data/normalized/
