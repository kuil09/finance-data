name: mission-inspect-kosis-12

on:
  push:
    branches: [feat/12-kosis-cpi]
    paths:
      - '.github/workflows/mission-inspect-kosis-12.yml'

concurrency:
  group: mission-inspect-kosis-12
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover concise public KOSIS CPI machine-endpoint evidence
        shell: bash
        run: |
          set -euo pipefail
          ua='finance-data/0.1 (+https://github.com/kuil09/finance-data)'
          page='https://kosis.kr/visual/nsportalStats/detailContents.do?listId=F&statJipyoId=3698&vStatJipyoId=4991'
          curl --connect-timeout 5 --max-time 15 -L -fsS -A "$ua" "$page" -o /tmp/cpi.html

          python - <<'PY'
          import html, re, subprocess
          from pathlib import Path
          from urllib.parse import urljoin, urlparse

          base='https://kosis.kr/visual/nsportalStats/detailContents.do?listId=F&statJipyoId=3698&vStatJipyoId=4991'
          text=Path('/tmp/cpi.html').read_text(encoding='utf-8', errors='replace')
          scripts=[]
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)', text, re.I):
              url=urljoin(base, html.unescape(src))
              if url.startswith('https://kosis.kr/') and url not in scripts:
                  scripts.append(url)

          corpus=[('indicator-page', text)]
          for i,url in enumerate(scripts[:35],1):
              out=f'/tmp/kosis-script-{i}.js'
              p=subprocess.run([
                  'curl','--connect-timeout','4','--max-time','10','-L','-fsS',
                  '-A','finance-data/0.1 (+https://github.com/kuil09/finance-data)',url,'-o',out
              ], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              if p.returncode == 0:
                  corpus.append((url, Path(out).read_text(encoding='utf-8',errors='replace')))

          endpoint_patterns=[
              r'["\']([^"\']+\.do(?:\?[^"\']*)?)["\']',
              r'["\']([^"\']+\.json(?:\?[^"\']*)?)["\']',
              r'url\s*:\s*["\']([^"\']+)["\']',
          ]
          keywords=('statjipyo','vstatjipyo','detailcontents','chart','tblid','orgid','itmid','objl','statisticsdata','openapi','select')
          candidates=[]
          contexts=[]
          identifiers=set(re.findall(r'DT_[A-Za-z0-9_]+', text))
          for source,body in corpus:
              for pat in endpoint_patterns:
                  for m in re.finditer(pat, body, re.I):
                      value=html.unescape(m.group(1))
                      low=value.lower()
                      if any(k in low for k in keywords):
                          absurl=urljoin(source if source.startswith('http') else base, value)
                          candidates.append(absurl)
              for m in re.finditer(r'.{0,180}(?:statJipyo|vStatJipyo|tblId|orgId|itmId|objL1|objL2|chartData|ajax).{0,260}', body, re.I|re.S):
                  clean=' '.join(html.unescape(m.group(0)).split())
                  if clean not in contexts:
                      contexts.append(clean[:500])
                      identifiers.update(re.findall(r'DT_[A-Za-z0-9_]+', clean))

          # Keep only KOSIS-hosted, de-duplicate, and probe GET endpoints without arbitrary POST execution.
          uniq=[]
          for u in candidates:
              if urlparse(u).netloc == 'kosis.kr' and u not in uniq:
                  uniq.append(u)

          probes=[]
          for u in uniq[:30]:
              # Never invoke logout/auth/admin-looking endpoints.
              low=u.lower()
              if any(x in low for x in ('logout','login','delete','insert','update','save')):
                  continue
              try:
                  p=subprocess.run([
                      'curl','--connect-timeout','4','--max-time','8','-L','-sS',
                      '-A','finance-data/0.1 (+https://github.com/kuil09/finance-data)',
                      '-o','/tmp/probe.out','-w','%{http_code} %{content_type} %{size_download}',u
                  ],capture_output=True,text=True,timeout=10)
                  meta=p.stdout.strip()
                  sample=Path('/tmp/probe.out').read_text(encoding='utf-8',errors='replace')[:500]
                  probes.append((u,meta,' '.join(sample.split())))
              except Exception as e:
                  probes.append((u,'ERROR',type(e).__name__))

          report=[]
          report.append('KOSIS CPI public-indicator endpoint inspection')
          report.append('indicator_url='+base)
          report.append('indicator_ids=listId:F,statJipyoId:3698,vStatJipyoId:4991')
          report.append('script_count='+str(len(scripts)))
          report.append('table_ids='+(','.join(sorted(identifiers)) if identifiers else '<none discovered>'))
          report.append('')
          report.append('[candidate_endpoints]')
          if uniq:
              report.extend(uniq[:50])
          else:
              report.append('<none>')
          report.append('')
          report.append('[probe_results]')
          if probes:
              for u,meta,sample in probes:
                  report.append(f'{meta} | {u} | sample={sample[:300]}')
          else:
              report.append('<none>')
          report.append('')
          report.append('[relevant_code_contexts]')
          report.extend(contexts[:80] or ['<none>'])
          Path('.github/kosis-12-inspection.txt').write_text('\n'.join(report)+'\n',encoding='utf-8')
          PY

      - name: Preserve concise inspection report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "finance-data bot"
          git config user.email "finance-data-bot@users.noreply.github.com"
          git add .github/kosis-12-inspection.txt
          git commit -m "chore: preserve KOSIS CPI endpoint inspection"
          git push origin HEAD:feat/12-kosis-cpi
