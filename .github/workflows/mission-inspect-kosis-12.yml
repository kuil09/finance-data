name: mission-inspect-kosis-12

on:
  push:
    branches: [feat/12-kosis-cpi]
    paths:
      - '.github/workflows/mission-inspect-kosis-12.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect public KOSIS CPI indicator machine calls
        shell: bash
        run: |
          set -euo pipefail
          ua='finance-data/0.1 (+https://github.com/kuil09/finance-data)'
          page='https://kosis.kr/visual/nsportalStats/detailContents.do?listId=F&statJipyoId=3698&vStatJipyoId=4991'
          curl --connect-timeout 5 --max-time 15 -L -fsS -A "$ua" "$page" -o /tmp/cpi.html
          echo "PAGE_BYTES=$(wc -c </tmp/cpi.html)"
          echo '=== CPI PAGE IDENTIFIERS / URL FRAGMENTS ==='
          grep -Ein '3698|4991|DT_[A-Za-z0-9_]+|tblId|orgId|itmId|objL1|ajax|json|detailContents|statJipyo|jipyo|chart|data' /tmp/cpi.html | head -400 || true

          echo '=== SCRIPT SOURCES ==='
          python - <<'PY'
          import re
          from urllib.parse import urljoin
          text=open('/tmp/cpi.html',encoding='utf-8',errors='replace').read()
          base='https://kosis.kr/visual/nsportalStats/detailContents.do?listId=F&statJipyoId=3698&vStatJipyoId=4991'
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)', text, re.I):
              print(urljoin(base,src))
          PY

          python - <<'PY' > /tmp/scripts.txt
          import re
          from urllib.parse import urljoin
          text=open('/tmp/cpi.html',encoding='utf-8',errors='replace').read()
          base='https://kosis.kr/visual/nsportalStats/detailContents.do?listId=F&statJipyoId=3698&vStatJipyoId=4991'
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)', text, re.I):
              print(urljoin(base,src))
          PY
          n=0
          while IFS= read -r src; do
            n=$((n+1))
            [[ $n -gt 30 ]] && break
            if curl --connect-timeout 4 --max-time 10 -L -fsS -A "$ua" "$src" -o "/tmp/script-$n.js"; then
              hits=$(grep -Ein 'statJipyo|vStatJipyo|detailContents|ajax|\.do|json|tblId|orgId|itmId|chartData|select.*Jipyo|select.*Stat' "/tmp/script-$n.js" | head -160 || true)
              if [[ -n "$hits" ]]; then
                echo "=== SCRIPT $n $src ==="
                echo "$hits"
              fi
            fi
          done < /tmp/scripts.txt
