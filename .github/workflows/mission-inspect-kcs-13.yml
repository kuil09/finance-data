name: mission-inspect-kcs-13

on:
  push:
    branches: [feat/13-kcs-trade]
    paths:
      - '.github/workflows/mission-inspect-kcs-13.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check configured Public Data Portal credential presence
        env:
          KCS_SERVICE_KEY: ${{ secrets.KCS_SERVICE_KEY }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${KCS_SERVICE_KEY:-}" ]]; then
            echo 'KCS_SERVICE_KEY_PRESENT=true'
          else
            echo 'KCS_SERVICE_KEY_PRESENT=false'
          fi
          if [[ -n "${DATA_GO_KR_SERVICE_KEY:-}" ]]; then
            echo 'DATA_GO_KR_SERVICE_KEY_PRESENT=true'
          else
            echo 'DATA_GO_KR_SERVICE_KEY_PRESENT=false'
          fi
