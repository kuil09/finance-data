name: mission-inspect-kcs-13

on:
  push:
    branches: [feat/13-kcs-trade]
    paths:
      - '.github/workflows/mission-inspect-kcs-13.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Resolve exact official related file-data contract
        shell: bash
        run: |
          set -euo pipefail
          ua='finance-data/0.1 (+https://github.com/kuil09/finance-data)'
          search='https://www.data.go.kr/tcs/dss/selectDataSetList.do?keyword=%EA%B4%80%EC%84%B8%EC%B2%AD_%EC%9B%94%EB%B3%84_%ED%92%88%EB%AA%A9%EB%B3%84_%EA%B5%AD%EA%B0%80%EB%B3%84%20%EC%88%98%EC%B6%9C%EC%9E%85%EC%8B%A4%EC%A0%81'
          curl --connect-timeout 5 --max-time 20 -L -fsS -A "$ua" "$search" -o /tmp/search.html
          python - <<'PY'
          import html,re
          from pathlib import Path
          text=Path('/tmp/search.html').read_text(encoding='utf-8',errors='replace')
          needle='관세청_월별_품목별_국가별 수출입실적'
          positions=[m.start() for m in re.finditer(re.escape(needle),text)]
          print('MATCHES=',len(positions))
          for i,pos in enumerate(positions[:10],1):
              chunk=html.unescape(text[max(0,pos-2500):pos+3500])
              print(f'=== CONTEXT {i} ===')
              # Reduce noisy markup but preserve href/onclick/data identifiers.
              for line in chunk.splitlines():
                  if any(k in line for k in ('href=', 'onclick=', 'data-', 'fileData', 'publicData', 'dataset', '관세청_', '/data/')):
                      print(' '.join(line.strip().split())[:1200])
              ids=sorted(set(re.findall(r'\b(?:15|10)\d{6,}\b',chunk)))
              print('NUMERIC_IDS=',ids)
              paths=sorted(set(re.findall(r'/data/\d+/(?:fileData|openapi)\.do[^"\'<> ]*',chunk)))
              print('DATA_PATHS=',paths)
          PY

          echo '=== CANDIDATE FILE DATA PATHS GLOBAL ==='
          grep -Eo '/data/[0-9]+/fileData\.do[^"<> ]*' /tmp/search.html | sort -u | head -100 || true
