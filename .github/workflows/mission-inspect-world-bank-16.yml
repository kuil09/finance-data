name: mission-inspect-world-bank-16

on:
  push:
    branches: [feat/16-world-bank-gdp]
    paths:
      - '.github/workflows/mission-inspect-world-bank-16.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect WDI GDP indicator and observation contract
        shell: bash
        run: |
          set -euo pipefail
          base='https://api.worldbank.org/v2'
          curl -fsS "$base/indicator/NY.GDP.MKTP.CD?source=2&format=json" -o /tmp/indicator.json
          curl -fsS "$base/country/all/indicator/NY.GDP.MKTP.CD?source=2&format=json&per_page=20000" -o /tmp/data.json
          python - <<'PY'
          import json, collections
          meta=json.load(open('/tmp/indicator.json'))
          print('INDICATOR=',json.dumps(meta,ensure_ascii=False,sort_keys=True)[:12000])
          payload=json.load(open('/tmp/data.json'))
          print('TOP_TYPE=',type(payload).__name__,'PARTS=',len(payload) if isinstance(payload,list) else None)
          header,rows=payload
          print('HEADER=',json.dumps(header,ensure_ascii=False,sort_keys=True))
          print('ROWS=',len(rows))
          print('FIELDS=',sorted({k for r in rows for k in r}))
          if rows:
              print('FIRST=',json.dumps(rows[0],ensure_ascii=False,sort_keys=True))
              print('LAST=',json.dumps(rows[-1],ensure_ascii=False,sort_keys=True))
          nulls=sum(r.get('value') is None for r in rows)
          print('NULL_VALUES=',nulls)
          years=sorted({int(r['date']) for r in rows if str(r.get('date','')).isdigit()})
          print('YEAR_RANGE=',years[0],years[-1],'YEAR_COUNT=',len(years))
          countries={r['countryiso3code']:r['country']['value'] for r in rows if r.get('countryiso3code')}
          print('AREA_COUNT=',len(countries))
          print('AREAS_SAMPLE=',json.dumps(sorted(countries.items())[:80],ensure_ascii=False))
          print('NONEMPTY_VALUES=',sum(r.get('value') is not None for r in rows))
          PY
