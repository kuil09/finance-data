name: mission-inspect-world-bank-16

on:
  push:
    branches: [feat/16-world-bank-gdp]
    paths:
      - '.github/workflows/mission-inspect-world-bank-16.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect WDI area identity edge cases
        shell: bash
        run: |
          set -euo pipefail
          url='https://api.worldbank.org/v2/country/all/indicator/NY.GDP.MKTP.CD?source=2&format=json&per_page=20000'
          curl -fsS "$url" -o /tmp/data.json
          python - <<'PY'
          import json
          header,rows=json.load(open('/tmp/data.json'))
          areas={(str(r['country']['id']),str(r.get('countryiso3code') or ''),str(r['country']['value'])) for r in rows}
          blank=sorted(a for a in areas if not a[1])
          print('AREA_ENTITIES=',len(areas))
          print('BLANK_ISO3_COUNT=',len(blank))
          print('BLANK_ISO3=',json.dumps(blank,ensure_ascii=False))
          ids=[a[0] for a in areas]
          print('UNIQUE_COUNTRY_IDS=',len(set(ids)))
          assert len(areas)==265, len(areas)
          assert len(set(ids))==265, len(set(ids))
          PY
