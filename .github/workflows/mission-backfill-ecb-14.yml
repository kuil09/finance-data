name: mission-backfill-ecb-14

on:
  push:
    branches: [feat/14-ecb-deposit-rate]
    paths:
      - '.github/workflows/mission-backfill-ecb-14.yml'

concurrency:
  group: mission-backfill-ecb-14
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify source identity
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Run tests and compile checks
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
          python -m compileall -q src tests

      - name: Validate manifests before source access
        run: |
          python -m json.tool sources/ecb_data_portal/source.json > /dev/null
          python -m json.tool datasets/ea/monetary_policy/deposit_facility_rate/dataset.json > /dev/null
          python -m json.tool catalog/datasets.json > /dev/null

      - name: Backfill official ECB deposit facility rate
        run: |
          set -euo pipefail
          ./bin/finance-data sync ea.monetary_policy.deposit_facility_rate --full | tee /tmp/ecb-summary.json
          ./bin/finance-data validate ea.monetary_policy.deposit_facility_rate | tee /tmp/ecb-validation.json
          python - <<'PY'
          import json
          report=json.load(open('/tmp/ecb-validation.json'))
          assert report['first_period'] == '1999-01-01', report
          assert report['records'] >= 10112, report
          assert report['source_key'] == 'D.U2.EUR.4F.KR.DFR.LEV', report
          PY

      - name: Validate all production datasets and deterministic rebuilds
        run: |
          set -euo pipefail
          datasets=(
            us.fiscal.debt.outstanding
            us.energy.petroleum.crude_oil.commercial_stocks
            us.prices.cpi_u.all_items
            us.national_accounts.gdp.current_dollars
            us.money_market.sofr
            kr.monetary_policy.base_rate
            ea.monetary_policy.deposit_facility_rate
          )
          for dataset in "${datasets[@]}"; do
            ./bin/finance-data validate "$dataset"
          done
          before=$(find data/normalized -type f -name 'data.csv' -print0 | sort -z | xargs -0 sha256sum | sha256sum)
          for dataset in "${datasets[@]}"; do
            ./bin/finance-data rebuild "$dataset"
          done
          after=$(find data/normalized -type f -name 'data.csv' -print0 | sort -z | xargs -0 sha256sum | sha256sum)
          test "$before" = "$after"

      - name: Preserve verified data in task branch
        run: |
          set -euo pipefail
          git config user.name "finance-data bot"
          git config user.email "finance-data-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "data: backfill ECB deposit facility rate"
          git push origin HEAD:feat/14-ecb-deposit-rate
