name: mission-verify-generic-storage-30

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Validate full checked-in Treasury dataset
        run: PYTHONPATH=src python -m finance_data validate us.fiscal.debt.outstanding
      - name: Rebuild Treasury data without changing canonical bytes
        run: |
          before=$(find data/normalized/us.fiscal.debt.outstanding -type f -name 'data.csv' -print0 | sort -z | xargs -0 sha256sum | sha256sum)
          PYTHONPATH=src python -m finance_data rebuild us.fiscal.debt.outstanding
          after=$(find data/normalized/us.fiscal.debt.outstanding -type f -name 'data.csv' -print0 | sort -z | xargs -0 sha256sum | sha256sum)
          test "$before" = "$after"
          git diff --exit-code -- data/normalized/us.fiscal.debt.outstanding
