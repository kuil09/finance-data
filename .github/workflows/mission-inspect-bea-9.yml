name: mission-inspect-bea-9

on:
  push:
    branches: [feat/9-bea-gdp]
    paths:
      - '.github/workflows/mission-inspect-bea-9.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
    steps:
      - name: Discover official BEA NIPA flat-file endpoint
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${BEA_API_KEY:-}" ]]; then echo 'BEA_API_KEY_PRESENT=true'; else echo 'BEA_API_KEY_PRESENT=false'; fi
          page='https://apps.bea.gov/iTable/?isuri=1&reqid=19&step=4&categories=flatfiles&nipa_table_list=1'
          curl -L -fsS "$page" -o /tmp/flat.html
          echo 'DOWNLOAD-LIKE URLS'
          grep -Eo 'https?[^"'"'"' <>]+|href="[^"]+"' /tmp/flat.html \
            | grep -Ei 'csv|zip|flat|download|nipa' \
            | head -100 || true
          echo 'HTML CONTEXT'
          grep -Ein 'csv|zip|download|flat file|T10105' /tmp/flat.html | head -80 || true
          echo 'NO-KEY API ERROR CONTRACT'
          curl -sS 'https://apps.bea.gov/api/data/?UserID=&method=GetData&DataSetName=NIPA&TableName=T10105&Frequency=Q&Year=X&ResultFormat=JSON' | head -c 1000
