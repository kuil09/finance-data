name: mission-inspect-bea-9

on:
  push:
    branches: [feat/9-bea-gdp]
    paths:
      - '.github/workflows/mission-inspect-bea-9.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
    steps:
      - name: Inspect official BEA NIPA access paths
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${BEA_API_KEY:-}" ]]; then echo 'BEA_API_KEY_PRESENT=true'; else echo 'BEA_API_KEY_PRESENT=false'; fi
          curl -L -fsS 'https://apps.bea.gov/national/Release/TXT/NipaDataQ.zip' -o /tmp/nipa-q.zip
          file /tmp/nipa-q.zip
          sha256sum /tmp/nipa-q.zip
          unzip -l /tmp/nipa-q.zip | head -60
          echo 'T10105 SAMPLE'
          name=$(unzip -Z1 /tmp/nipa-q.zip | grep -E 'T10105.*(csv|txt)$' | head -1 || true)
          echo "ENTRY=$name"
          if [[ -n "$name" ]]; then unzip -p /tmp/nipa-q.zip "$name" | head -12; fi

          if [[ -n "${BEA_API_KEY:-}" ]]; then
            url="https://apps.bea.gov/api/data/?UserID=${BEA_API_KEY}&method=GetData&DataSetName=NIPA&TableName=T10105&Frequency=Q&Year=X&ResultFormat=JSON"
            curl -fsS "$url" -o /tmp/bea.json
            python - <<'PY'
          import json
          p=json.load(open('/tmp/bea.json'))
          r=p['BEAAPI']['Results']
          print('UTCProductionTime', r.get('UTCProductionTime'))
          print('Statistic', r.get('Statistic'))
          data=r.get('Data', [])
          print('ROWS', len(data))
          for row in data:
              if str(row.get('LineNumber')) == '1':
                  print('GDP_LINE_SAMPLE', json.dumps(row, sort_keys=True))
                  break
          PY
          else
            curl -sS 'https://apps.bea.gov/api/data/?UserID=&method=GetData&DataSetName=NIPA&TableName=T10105&Frequency=Q&Year=X&ResultFormat=JSON' | head -c 1000
          fi
