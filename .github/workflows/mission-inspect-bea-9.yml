name: mission-inspect-bea-9

on:
  push:
    branches: [feat/9-bea-gdp]
    paths:
      - '.github/workflows/mission-inspect-bea-9.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect official BEA NIPA flat files
        shell: bash
        run: |
          set -euo pipefail
          base='https://apps.bea.gov/national/Release/TXT'
          for name in SeriesRegister.txt TablesRegister.txt nipadataQ.txt; do
            curl -L -fsS "$base/$name" -o "/tmp/$name"
            echo "=== $name $(wc -c </tmp/$name) bytes ==="
            head -5 "/tmp/$name"
          done
          echo '=== SERIES A191RC ==='
          grep -E '^%?A191RC,' /tmp/SeriesRegister.txt || true
          echo '=== TABLE T10105 ==='
          grep -E '^T10105,' /tmp/TablesRegister.txt || true
          echo '=== GDP QUARTERLY RECORDS ==='
          grep -E '^%?A191RC,' /tmp/nipadataQ.txt | head -5 || true
          grep -E '^%?A191RC,' /tmp/nipadataQ.txt | tail -5 || true
