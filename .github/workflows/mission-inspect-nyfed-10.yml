name: mission-inspect-nyfed-10

on:
  push:
    branches: [feat/10-nyfed-sofr]
    paths:
      - '.github/workflows/mission-inspect-nyfed-10.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect official NY Fed SOFR API contract
        shell: bash
        run: |
          set -euo pipefail
          docs='https://markets.newyorkfed.org/static/docs/markets-api.html'
          curl -fsS "$docs" -o /tmp/docs.html
          echo 'DOC SEARCH ENDPOINT CONTEXT'
          grep -Ein 'search.json|volumeInBillions|type=|volume' /tmp/docs.html | head -120 || true

          base='https://markets.newyorkfed.org/api/rates/secured/sofr/search.json?startDate=2018-04-03&endDate=2026-09-06'
          for mode in none rate volume rate-volume; do
            case "$mode" in
              none) url="$base" ;;
              rate) url="$base&type=rate" ;;
              volume) url="$base&type=volume" ;;
              rate-volume) url="$base&type=rate,volume" ;;
            esac
            code=$(curl -sS -o "/tmp/$mode.json" -w '%{http_code}' "$url")
            echo "MODE=$mode HTTP=$code BYTES=$(wc -c < /tmp/$mode.json)"
            python - "$mode" <<'PY'
          import json,sys
          name=sys.argv[1]
          try: p=json.load(open('/tmp/'+name+'.json'))
          except Exception as e:
              print(name, 'json_error=', e); raise SystemExit
          rows=p.get('refRates')
          print(name, 'top_keys=', sorted(p), 'rows=', len(rows) if isinstance(rows,list) else None)
          if isinstance(rows,list) and rows:
              print(name, 'first=', json.dumps(rows[0], sort_keys=True))
              print(name, 'record_keys=', sorted({k for r in rows for k in r}))
          else:
              print(name, json.dumps(p, sort_keys=True)[:2000])
          PY
          done
