name: mission-inspect-nyfed-10

on:
  push:
    branches: [feat/10-nyfed-sofr]
    paths:
      - '.github/workflows/mission-inspect-nyfed-10.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect historical SOFR NA semantics
        shell: bash
        run: |
          set -euo pipefail
          url='https://markets.newyorkfed.org/api/rates/secured/sofr/search.json?startDate=2018-04-03&endDate=2026-09-06&type=rate,volume'
          curl -fsS "$url" -o /tmp/sofr.json
          python - <<'PY'
          import json, collections
          rows=json.load(open('/tmp/sofr.json'))['refRates']
          fields=['percentRate','percentPercentile1','percentPercentile25','percentPercentile75','percentPercentile99','volumeInBillions']
          for field in fields:
              bad=[r for r in rows if r.get(field) in (None,'','NA')]
              print(field, 'missing_or_na=', len(bad))
              if bad:
                  print(field, 'first_examples=', json.dumps(bad[-5:], sort_keys=True))
                  print(field, 'newest_examples=', json.dumps(bad[:5], sort_keys=True))
          any_bad=[r for r in rows if any(r.get(f) in (None,'','NA') for f in fields)]
          print('any_missing_or_na=', len(any_bad))
          if any_bad:
              dates=[r['effectiveDate'] for r in any_bad]
              print('date_range=', min(dates), max(dates))
              print('all_bad_rows=', json.dumps(any_bad, sort_keys=True))
          footnotes=[r for r in rows if r.get('footnoteId') not in (None,'')]
          print('footnoted=', len(footnotes))
          print('footnotes=', json.dumps(footnotes, sort_keys=True))
          revisions=[r for r in rows if r.get('revisionIndicator') not in (None,'')]
          print('revisions=', len(revisions))
          print('revision_rows=', json.dumps(revisions, sort_keys=True))
          PY
